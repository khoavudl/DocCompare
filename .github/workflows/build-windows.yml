name: Build Windows Application (.exe)

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub Web
  push:
    tags:
      - "v*" # Tự động kích hoạt khi gắn tag phiên bản, ví dụ: v1.0.0

jobs:
  build:
    name: Build DocCompare for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "DocCompare" `
            --add-data "config/filters.yaml;config" `
            --add-data "report/template.html.j2;report" `
            --add-data "Logo-fes.png;." `
            app.py

      - name: Archive build directory to ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DocCompare -DestinationPath DocCompare-windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocCompare-windows-x64
          path: DocCompare-windows-x64.zip
          retention-days: 30

      - name: Create GitHub Release (if tag pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DocCompare-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
